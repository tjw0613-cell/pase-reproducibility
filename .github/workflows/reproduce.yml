name: Reproduction checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  figures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            current_figures/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -B scripts/check_delivery.py
      - run: python -B reproduce.py all
      - uses: actions/upload-artifact@v4
        with:
          name: figures-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            outputs/Figure_*.pdf
            verification_report.json
